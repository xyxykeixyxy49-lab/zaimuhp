name: 表記チェック・ビルド

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build   # NGワードチェック（src）→ ビルド
      - run: node tools/check-terms.mjs   # ビルド後のHTMLも検査
